[project]
name = "todo-server"
version = "0.1.0"
description = "A Flask server for learning how to build frontends for hosted services."
authors = [
    { name = "Brian Bennett (BucksCompSci)", email = "bbennett@buchananschools.com"}
]
dependencies = [
    "flask>=3.1.0",
    "sqlalchemy>=2.0.37",
    "python-dotenv>=1.0.1",
    "webargs>=8.6.0",
    "flask-migrate>=4.1.0",
    "gunicorn>=23.0.0",
    "flask-sqlalchemy>=3.1.1",
    "psycopg2-binary>=2.9.10",
    "flask-login>=0.6.3",
    "flask-marshmallow>=1.3.0",
    "marshmallow-sqlalchemy>=1.4.0",
]
readme = "README.md"
requires-python = ">= 3.12"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = []

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/todo_server"]
