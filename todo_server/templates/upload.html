{% extends 'layout.html' %} {% block sidebar %}
  <ul>
    <li><a href="{{url_for('index')}}">Home</a></li>
    <li><a href="{{ url_for('admin.admin_index') }}">Manage Projects</a></li>
  </ul>
{% endblock %} {% block main_content %}
<div class="not-sidebar">
  <h2>Project Deploy</h2>
  <p>
    Upload your zipped project files to finish your submission. Copy and paste
    the URL you receive and submit it to Google Classroom.
  </p>
  <form method="post" action="" enctype="multipart/form-data">
    <label
      >Assignment name (required):
      <input type="text" name="name" placeholder="Project name" required />
    </label>
    <label>Project .zip (required)
    <input type="file" name="file" />
    </label>
    <input type="submit" value="Submit" />
  </form>
</div>
{% endblock %}
